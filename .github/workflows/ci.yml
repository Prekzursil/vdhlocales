name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate TOML locale files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Parse every TOML file
        run: |
          python - <<'PY'
          import glob, sys, tomllib
          files = sorted(glob.glob("*.toml"))
          bad = []
          for f in files:
              try:
                  with open(f, "rb") as fh:
                      tomllib.load(fh)
              except Exception as exc:
                  bad.append(f"{f}: {exc}")
          print(f"validated {len(files)} TOML files")
          if bad:
              for line in bad:
                  print(line)
              sys.exit(1)
          PY
